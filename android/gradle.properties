org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Workaround: R8 + core library desugaring (L8) can fail with "Type *.a is defined multiple times"
# on bundleRelease. Re-enable (remove line) after AGP/desugar fixes; bundle size will be larger.
shrink=false
